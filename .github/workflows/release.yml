name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: |
            go.sum
            plugins/markdown/go.mod
      - name: Install benchmark prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - run: make check
      - run: make benchmark-release
      - name: Build release artifacts
        run: make release VERSION="${GITHUB_REF_NAME#v}"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease_args=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease_args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            "${prerelease_args[@]}" \
            dist/ygg-darwin-arm64 \
            dist/ygg-darwin-amd64 \
            dist/ygg-linux-arm64 \
            dist/ygg-linux-amd64 \
            dist/SHA256SUMS \
            .dev/bench/release-report.json
